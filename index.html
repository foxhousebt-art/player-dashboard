<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAYER — Living World</title><link rel="stylesheet" href="living_world.css"></head><body>
<div id="scene">
 <div class="master"></div><div class="daylight"></div>
 <div class="waterfall w1"></div><div class="waterfall w2"></div><div class="waterfall w3"></div>
 <div id="livingActors" aria-hidden="true">
  <img class="depth-ship ship-a" src="world_ship.png">
  <img class="depth-ship ship-b" src="world_ship.png">
  <img class="depth-ship ship-c" src="world_ship.png">
  <div class="worker-route wr1"><img class="depth-mech" src="world_mech.png"></div>
  <div class="worker-route wr2"><img class="depth-mech" src="world_mech.png"></div>
  <div class="worker-route wr3"><img class="depth-mech" src="world_mech.png"></div>
  <div class="cargo-lift lift1"><span></span></div>
  <div class="cargo-lift lift2"><span></span></div>
  <div class="world-event beacon1"></div><div class="world-event beacon2"></div>
  <div class="drone-swarm"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="traffic-lights"><i></i><i></i><i></i><i></i></div>
  <div class="energy-pulse ep1"></div><div class="energy-pulse ep2"></div>
  <div class="bridge-traffic bt1"></div><div class="bridge-traffic bt2"></div>
 </div>
 <div class="steam st1"></div><div class="steam st2"></div><div class="fireflies"></div>
</div>

<!-- Dynamic values are placed directly over the corresponding displays in the approved artwork. -->
<div id="dynamic">
 <div class="date"><span id="date">--</span><strong id="time">--:--</strong><small id="weekLabel">--</small></div>
 <button class="difficulty difficulty-card" id="difficultyCard" type="button"><small>MODE</small><b id="difficultyName">ENGAGÉ</b><span id="difficultyLevel">II</span></button>
 <div class="player-live"><img id="playerSprite" src="sprites/animated/brian_lvl_001_base/idle_00.png" alt="Personnage"></div>
 <div class="level"><strong id="globalLevel">1</strong><span><b id="xpIntoLevel">0</b> / <b id="xpLevelCost">120</b> XP</span></div>
 <button class="metric r" data-stat="lecture" type="button"><b id="readingValue">0 XP</b><small id="readingLevel">NIV. 1</small></button>
 <button class="metric l" data-stat="apprentissage" type="button"><b id="learningValue">0 XP</b><small id="learningLevel">NIV. 1</small></button>
 <button class="metric sp" data-stat="sport" type="button"><b id="sportValue">0 / 4</b><small id="sportStatus">EN COURS</small></button>
 <button class="metric wo" data-stat="travail" type="button"><b id="workValue">0 XP</b><small id="workLevel">NIV. 1</small></button>
 <button class="metric fi" data-stat="finance" type="button"><b id="financeValue">0 €</b><small>RESTANT</small></button>
 <button class="metric nu" data-stat="nutrition" type="button"><b id="nutritionValue">0 XP</b><small id="nutritionLevel">NIV. 1</small></button>
 <button class="metric sm" data-stat="tabac" type="button"><b id="smokeValue">0 J</b><small id="smokeStatus">INCONNU</small></button>
 <div class="summary"><span class="gain">+<b id="grossXp">0</b></span><span class="loss">-<b id="penaltyXp">0</b></span><span class="bonus">+<b id="comebackXp">0</b></span><span class="net">+<b id="totalXp">0</b></span></div>
</div>

<!-- Invisible interaction map follows the actual menu in the artwork. -->
<nav id="hotspots">
 <a class="dash" href="index.html" title="Dashboard"></a><a class="analysis" href="analyse.html" title="Analyse"></a>
 <button class="objectives" data-panel="objectives"></button><button class="settings" data-panel="settings"></button>
 <button class="world" data-panel="mode" title="Mode de difficulté"></button><button class="citations" data-panel="citations"></button>
<span id="modeMenuLabel">MODE</span></nav>
<div id="worldFlash"></div><div id="eventBanner"><b>ÉVÉNEMENT MONDE</b><span></span></div>
<div id="sidePanel" aria-hidden="true"><button id="panelClose">×</button><small id="panelKicker">PLAYER SYSTEM</small><h2 id="panelTitle"></h2><div id="panelBody"></div></div>
<div id="toast"></div>
<script src="config.js"></script><script src="progression_engine.js"></script><script src="data_sync.js"></script><script src="living_world.js"></script>
<script src="living_city.js"></script><script src="ui_polish.js"></script><script src="coherent_ui.js"></script></body></html>
