<div id="scene">
 <div class="master"></div><div class="daylight"></div>
 <div class="waterfall w1"></div><div class="waterfall w2"></div><div class="waterfall w3"></div>
 <div id="livingActors" aria-hidden="true">
  <img class="depth-ship ship-a" src="world_ship.png">
  <img class="depth-ship ship-b" src="world_ship.png">
  <img class="depth-ship ship-c" src="world_ship.png">
  <div class="worker-route wr1"><img class="depth-mech" src="world_mech.png"></div>
  <div class="worker-route wr2"><img class="depth-mech" src="world_mech.png"></div>
  <div class="worker-route wr3"><img class="depth-mech" src="world_mech.png"></div>
  <div class="cargo-lift lift1"><span></span></div>
  <div class="cargo-lift lift2"><span></span></div>
  <div class="world-event beacon1"></div><div class="world-event beacon2"></div>
  <div class="drone-swarm"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="traffic-lights"><i></i><i></i><i></i><i></i></div>
  <div class="energy-pulse ep1"></div><div class="energy-pulse ep2"></div>
  <div class="bridge-traffic bt1"></div><div class="bridge-traffic bt2"></div>
 </div>
 <div class="steam st1"></div><div class="steam st2"></div><div class="fireflies"></div>
</div>

<!-- Dynamic values are placed directly over the corresponding displays in the approved artwork. -->
<div id="dynamic">
<section class="ui-clock"><span id="date">—</span><strong id="time">--:--</strong><small id="weekLabel">—</small></section>
<button class="ui-mode" id="difficultyCard" type="button"><small>MODE DE DIFFICULTÉ</small><strong id="difficultyName">ENGAGÉ</strong><b id="difficultyLevel">II</b></button>
<section class="ui-player-level"><small>NIVEAU</small><strong id="globalLevel">1</strong><span><b id="xpIntoLevel">0</b> / <b id="xpLevelCost">120</b> XP</span></section>
<button class="ui-stat stat-reading" data-stat="lecture"><b id="readingXp">0 XP</b><small id="readingLevel">NIV. 1</small></button>
<button class="ui-stat stat-learning" data-stat="apprentissage"><b id="learningXp">0 XP</b><small id="learningLevel">NIV. 1</small></button>
<button class="ui-stat stat-sport" data-stat="sport"><b id="sportWeek">0 / 4</b><small id="sportStatus">EN COURS</small></button>
<button class="ui-stat stat-work" data-stat="travail"><b id="workXp">0 XP</b><small id="workLevel">NIV. 1</small></button>
<button class="ui-stat stat-finance" data-stat="finance"><b id="financeRemaining">0 €</b><small id="financeStatus">RESTANT</small></button>
<button class="ui-stat stat-nutrition" data-stat="nutrition"><b id="nutritionXp">0 XP</b><small id="nutritionLevel">NIV. 1</small></button>
<button class="ui-stat stat-smoke" data-stat="tabac"><b id="smokeStreak">0 J</b><small id="smokeStatus">INCONNU</small></button>
<section class="ui-summary"><span class="gain">+<b id="grossXp">0</b></span><span class="loss">-<b id="penaltyXp">0</b></span><span class="come">+<b id="comebackXp">0</b></span><span class="net">+<b id="netXp">0</b></span></section>
</div>

</nav>
